  entryFile: SKILL.md
  scriptsDir: scripts
  referencesDir: references
  assetsDir: assets
  suggestedAgents:
    - cyberclaw/report-agent
  requiredCapabilities:
    - github.issue.create
  suggestedConnectors:
    - github
  workflowTemplates: []
