[package]
name = "example-plugin"
version = "0.1.0"
edition = "2021"
authors = ["CyberClaw Team"]
license = "Apache-2.0"
description = "Example CyberClaw Plugin"

[lib]
crate-type = ["cdylib"]
name = "example_plugin"

[dependencies]
cyberclaw-plugin-runtime = { path = "../../../crates/cyberclaw-plugin-runtime" }
cyberclaw-core = { path = "../../../crates/cyberclaw-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = "0.4"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"