<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CyberClaw Admin Console</title>
<!-- 抑制 favicon.ico 请求：admin 目前没有 favicon 资产，浏览器自动请求会撞上 JWT 中间件返回 401 -->
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<!-- Tailwind JIT 自托管：原 https://cdn.tailwindcss.com?plugins=forms,typography
     拷贝至 web/dist/tailwind.runtime.js，避免外部依赖 + 离线可用 + 去 console warning。
     注：runtime JIT 仍非 production 最优（理想是 PostCSS 静态编译），但 cyberclaw
     当前无 bundler，暂以自托管 runtime 为最小修法。-->
<script src="/admin/dist/tailwind.runtime.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  :root {
    --accent-h: 243;
    --accent-s: 75%;
    --accent-l: 59%;
    --accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l));
    --accent-fg: #fff;
    --accent-soft: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.12);
    --accent-ring: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.35);
  }
  /* light */
  .light {
    --bg: #fafafa;
    --bg-2: #ffffff;
    --bg-3: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --fg: #09090b;
    --fg-2: #3f3f46;
    --fg-3: #71717a;
    --fg-4: #a1a1aa;
    --hover: #f4f4f5;
    --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04);
  }
  /* dark */
  .dark {
    --bg: #0a0a0b;
    --bg-2: #111113;
    --bg-3: #17171a;
    --border: #242428;
    --border-strong: #2e2e33;
    --fg: #f4f4f5;
    --fg-2: #c8c8cf;
    --fg-3: #8a8a93;
    --fg-4: #5a5a63;
    --hover: #18181b;
    --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.4);
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11','ss01','ss03'; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-feature-settings: 'zero','ss01'; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  /* utility-ish tokens */
  .bg-bg { background: var(--bg); }
  .bg-bg-2 { background: var(--bg-2); }
  .bg-bg-3 { background: var(--bg-3); }
  .bg-hover:hover { background: var(--hover); }
  .text-fg { color: var(--fg); }
  .text-fg-2 { color: var(--fg-2); }
  .text-fg-3 { color: var(--fg-3); }
  .text-fg-4 { color: var(--fg-4); }
  .border-border { border-color: var(--border); }
  .border-border-strong { border-color: var(--border-strong); }
  .ring-accent { --tw-ring-color: var(--accent-ring); }
  .text-accent { color: var(--accent); }
  .bg-accent { background: var(--accent); color: var(--accent-fg); }
  .bg-accent-soft { background: var(--accent-soft); color: var(--accent); }
  .border-accent { border-color: var(--accent); }

  /* Focus ring */
  .focus-ring:focus { outline: 2px solid var(--accent-ring); outline-offset: 2px; }

  /* Live pulse */
  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.85); }
  }
  .pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-slide-up { animation: slide-up .22s ease-out; }

  @keyframes sheet-in {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  .anim-sheet-in { animation: sheet-in .24s cubic-bezier(.4,0,.2,1); }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .anim-fade-in { animation: fade-in .18s ease-out; }

  @keyframes dialog-in {
    from { opacity: 0; transform: translate(-50%, -48%) scale(.97); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .anim-dialog-in { animation: dialog-in .18s ease-out; }

  /* Density */
  .density-comfortable .row-pad { padding-top: 12px; padding-bottom: 12px; }
  .density-compact .row-pad { padding-top: 7px; padding-bottom: 7px; }

  /* Shadow / elevation */
  .elev-1 { box-shadow: var(--shadow); }

  /* Skeleton shimmer */
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
  .skeleton {
    background: linear-gradient(90deg, var(--bg-3) 0%, var(--border) 20%, var(--bg-3) 40%, var(--bg-3) 100%);
    background-size: 400px 100%;
    animation: shimmer 1.4s linear infinite;
    border-radius: 4px;
  }

  /* grid bg for login */
  .grid-bg {
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  /* Trace bar */
  .trace-bar { height: 14px; border-radius: 2px; position: relative; }
  .trace-bar::after { content: ''; position: absolute; inset: 0; border-radius: 2px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08); }

  /* Badge base */
  .b { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; line-height: 16px; border: 1px solid transparent; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.01em; }

  /* kbd */
  .kbd { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border-strong); background: var(--bg-3); color: var(--fg-3); }

  /* Ascii separator */
  .ascii-sep { color: var(--fg-4); letter-spacing: 2px; }

  /* selection */
  ::selection { background: var(--accent-soft); color: var(--accent); }

  /* Sprint 14 S14-6: markdown-body + copy-code-btn */
  .markdown-body { line-height: 1.65; }
  .markdown-body h1,.markdown-body h2,.markdown-body h3,
  .markdown-body h4,.markdown-body h5,.markdown-body h6 {
    font-weight: 600; margin: 0.75em 0 0.4em; color: var(--fg);
  }
  .markdown-body h1 { font-size: 1.25em; }
  .markdown-body h2 { font-size: 1.1em; }
  .markdown-body h3 { font-size: 1em; }
  .markdown-body p { margin: 0.4em 0; }
  .markdown-body ul,.markdown-body ol { padding-left: 1.4em; margin: 0.4em 0; }
  .markdown-body li { margin: 0.2em 0; }
  .markdown-body code:not(pre code) {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85em; background: var(--bg-3); padding: 1px 5px;
    border-radius: 3px; color: var(--accent);
  }
  .markdown-body pre {
    background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; overflow-x: auto;
    margin: 0.6em 0; font-size: 0.82em;
  }
  .markdown-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .markdown-body blockquote {
    border-left: 3px solid var(--accent); margin: 0.5em 0;
    padding: 2px 12px; color: var(--fg-3); font-style: italic;
  }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.9em; }
  .markdown-body th,.markdown-body td {
    border: 1px solid var(--border); padding: 5px 10px; text-align: left;
  }
  .markdown-body th { background: var(--bg-3); font-weight: 600; }
  .markdown-body a { color: var(--accent); text-decoration: underline; }
  .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
  .copy-code-btn {
    position: absolute; top: 7px; right: 8px;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    border: 1px solid var(--border-strong); background: var(--bg-2);
    color: var(--fg-3); cursor: pointer; opacity: 0.7; transition: opacity 0.15s;
  }
  .copy-code-btn:hover { opacity: 1; color: var(--fg); }
</style>
</head>
<body>
  <script>
    // Apply saved theme + density BEFORE boot splash renders.
    // Prevents white-theme users from seeing a black flash on refresh.
    // Mirrors app.jsx applyTheme/applyDensity — localStorage key
    // 'cyberclaw.admin.tweaks' stores {theme, density, ...}. Defaults: dark/comfortable.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('cyberclaw.admin.tweaks') || 'null') || {};
        var theme = saved.theme === 'light' ? 'light' : 'dark';  // accept only known values
        var density = saved.density === 'compact' ? 'compact' : 'comfortable';
        document.body.classList.add(theme, 'density-' + density);
      } catch (e) {
        document.body.classList.add('dark', 'density-comfortable');
      }
    })();
  </script>
  <div id="root">
    <!-- Loading splash — shown while Babel compiles JSX. Removed on React mount. -->
    <div id="boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--fg-3);">
      <div style="width:56px;height:56px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);animation:cc-pulse 1.4s ease-in-out infinite;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L14 8 L20 8 L15 12 L17 18 L12 14 L7 18 L9 12 L4 8 L10 8 Z"/></svg>
      </div>
      <div style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;">CyberClaw Admin · loading</div>
      <div style="width:120px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;">
        <div style="width:40%;height:100%;background:var(--accent);animation:cc-slide 1.2s ease-in-out infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes cc-pulse { 0%,100% { transform:scale(1); opacity:0.9; } 50% { transform:scale(1.08); opacity:1; } }
      @keyframes cc-slide { 0% { margin-left:-40%; } 100% { margin-left:100%; } }
    </style>
  </div>

  <!-- Markdown + syntax highlight (Sprint 14 S14-6) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js" integrity="sha384-sEbSAVChZf96yGwC9+icch4NILuG43R1/kw12tY6RqkTzzpD1KDjJ1+qAYWGedxS" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet" integrity="sha384-RCpAEDK2BSI4uVvV9kefzLdwlNUNZkCZJdOE2LkEa3jtLRcv2YrEVSbM4vwbCCW2" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" integrity="sha384-ZM8fDxYm+GXOWeJcxDetoRImNnEAS7XwVFH5kv0pT6RXNy92Nemw/Sj7NfciXpqg" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" integrity="sha384-Uq05+JLko69eOiPr39ta9bh7kld5PKZoU+fF7g0EXTAriEollhZ+DrN8Q/Oi8J2Q" crossorigin="anonymous"></script>
  <script>
    if (window.Prism && window.Prism.plugins && window.Prism.plugins.autoloader) {
      window.Prism.plugins.autoloader.languages_path = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';
    }
    if (window.marked) {
      window.marked.setOptions({
        gfm: true,
        breaks: true,
        headerIds: false,
        mangle: false,
      });
      window.marked.use({
        highlight: function(code, lang) {
          if (lang && window.Prism && window.Prism.languages && window.Prism.languages[lang]) {
            return window.Prism.highlight(code, window.Prism.languages[lang], lang);
          }
          return code;
        },
      });
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script>
    // React hook bootstrap — expose hooks as window globals.
    // Each compiled SPA module is wrapped in an IIFE (see babel.config.js)
    // so top-level `const { useState } = React` no longer leaks to global
    // scope. Many files use `useState` bare (and rely on the leak from
    // `ui.js`, which loads first). This bootstrap restores that contract
    // explicitly so the IIFE-wrapped modules still resolve bare hook names
    // via the window-as-global fallback.
    Object.assign(window, {
      useState: React.useState,
      useEffect: React.useEffect,
      useRef: React.useRef,
      useMemo: React.useMemo,
      useCallback: React.useCallback,
      useContext: React.useContext,
      useReducer: React.useReducer,
      useLayoutEffect: React.useLayoutEffect,
      createContext: React.createContext,
      Fragment: React.Fragment,
    });
  </script>
