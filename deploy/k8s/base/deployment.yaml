apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberclaw-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cyberclaw-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyberclaw-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cyberclaw-server
          # Override per-overlay; this is a placeholder.
          image: cyberclaw-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: raft
              containerPort: 7700
              protocol: TCP
          env:
            # Address the HTTP server binds.
            - name: CYBERCLAW_ADDR
              value: "0.0.0.0:3000"
            - name: ENVIRONMENT
              value: "production"
            - name: USE_TLS
              value: "false"  # TLS terminates at the Ingress
          envFrom:
            # Mount LLM credentials from secret. Required keys:
            # LLM_PROVIDER, LLM_API_KEY, LLM_BASE_URL, LLM_DEFAULT_MODEL.
            - secretRef:
                name: cyberclaw-llm
            # Mount JWT secret. Required key: JWT_SECRET (48-byte base64).
            - secretRef:
                name: cyberclaw-jwt
            # Mount cluster shared token. Required key: CYBERCLAW_CLUSTER_SHARED_TOKEN.
            - secretRef:
                name: cyberclaw-cluster
                optional: true
            # Mount runtime tuning + feature flags from configmap.
            - configMapRef:
                name: cyberclaw-config
          volumeMounts:
            - name: cyberclaw-data
              mountPath: /var/lib/cyberclaw
            - name: cyberclaw-audit
              mountPath: /home/cyberclaw/.cyberclaw
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/system/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: cyberclaw-data
          persistentVolumeClaim:
            claimName: cyberclaw-data
        - name: cyberclaw-audit
          persistentVolumeClaim:
            claimName: cyberclaw-audit
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      terminationGracePeriodSeconds: 30
