apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cyberclaw

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml

patches:
  - path: deployment-patch.yaml

images:
  - name: cyberclaw-server
    # Production: pinned digest, signed by cosign in CI.
    newName: ghcr.io/your-org/cyberclaw-server
    newTag: v0.1.0  # Update per release

commonLabels:
  app.kubernetes.io/instance: production
