apiVersion: v1
kind: ConfigMap
metadata:
  name: cyberclaw-config
data:
  # Staging: chatty logs for debugging.
  RUST_LOG: "info,cyberclaw=debug"

  # Staging: wide rate limit for E2E tests + Playwright suites.
  RATE_LIMIT_PER_SECOND: "1000"
  RATE_LIMIT_BURST_SIZE: "5000"

  # Staging: native runtime — no container isolation; demo speed
  # over isolation for now. Production overlay overrides to "process".
  CYBERCLAW_RUNTIME_STRATEGY: "native"
