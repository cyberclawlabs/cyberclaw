[package]
name = "cyberclaw-plugin-runtime"
version = "0.1.0"
edition = "2021"
description = "CyberClaw Platform Plugin Runtime"
license = "Apache-2.0"

[dependencies]
# Workspace crates
cyberclaw-core = { path = "../cyberclaw-core" }

# Plugin loading
libloading = "0.8"

# Versioning
semver = { version = "1.0", features = ["serde"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Collections
indexmap = "2.7"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"
