[package]
name = "cyberclaw-connectors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
cyberclaw-core.workspace = true
cyberclaw-governance.workspace = true
cyberclaw-llm.workspace = true
cyberclaw-skill-runtime.workspace = true
cyberclaw-observability.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
glob.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
walkdir.workspace = true
dashmap = "5.5"
once_cell = "1.19"
thiserror.workspace = true
toml = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "process"] }
libc = "0.2"

# Database support (升级至 0.8.1 以修复 CVE-2024-45610)
sqlx = { version = "0.8.1", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json", "chrono", "uuid"] }

# GitHub Connector dependencies
octocrab = "0.42"
governor = "0.6"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }

# MCP (Model Context Protocol) support
jsonrpc-core = "18.0"
url = "2.5"

# Slack Connector dependencies
handlebars = "4.5"
base64 = "0.21"

# Discord adapter — Ed25519 webhook signature verification (R-06)
ed25519-dalek = "2.1"

# Message Gateway Connector dependencies
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"

# Lark/Feishu adapter: WebSocket long connection + AES event decryption
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures.workspace = true
aes = "0.8"

# Sandbox connector: tempdir + process isolation for evolution experiments
tempfile = "3.14"

# Semantic memory connector: advisory file locking for multi-writer safety
fs4 = { version = "0.13", features = ["sync"] }

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.36", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
proptest = "1.0"
