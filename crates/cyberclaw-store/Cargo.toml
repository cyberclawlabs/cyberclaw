[package]
name = "cyberclaw-store"
version = "0.1.0"
edition = "2021"
description = "Persistent storage layer for CyberClaw platform (PostgreSQL + SQLite + in-memory)"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Database -- PostgreSQL (via sqlx)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"], optional = true }
refinery = { version = "0.8", features = ["tokio-postgres"], optional = true }

# Database -- SQLite (via rusqlite)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# UUID and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
testcontainers = "0.15"
criterion = { version = "0.5", features = ["async_tokio"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[[bench]]
name = "memory_write_bench"
harness = false

[features]
default = ["postgres"]
postgres = ["sqlx", "refinery"]
sqlite = ["rusqlite"]
memory-only = []
