name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run tests with sqlite feature
        run: cargo test --workspace --features sqlite

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit --ignore RUSTSEC-2023-0071

  webui-e2e:
    name: WebUI E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Build server (release)
        run: cargo build --release -p cyberclaw-server
      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Seed minimal config
        run: |
          mkdir -p ~/.cyberclaw
          cat > ~/.cyberclaw/config.toml <<'EOF'
          [server]
          bind_addr = "127.0.0.1:38090"
          EOF
          echo '{"users":[{"id":"qa-admin","role":"admin"}]}' > ~/.cyberclaw/users.json
      - name: Start server
        env:
          LLM_API_KEY: dummy-for-ci
          LLM_PROVIDER: generic
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-32char-jwt-secret-replace-me' }}
          CYBERCLAW_APPROVAL_SECRET: ${{ secrets.CI_APPROVAL_SECRET || 'ci-only-32char-approval-secret-here' }}
        run: |
          ./target/release/cyberclaw-server &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:38090/health && break
            sleep 1
          done
      - name: Run Playwright E2E
        working-directory: web
        run: pnpm test:e2e
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
