openapi: 3.0.3

info:
  title: CyberClaw API
  description: |
    CyberClaw controlled agent platform — public API surface.

    This spec covers the **consumer-facing subset** of the full 91 routes (see
    `ROUTES.md`). Internal cluster, wizard, webhook, and dev routes are
    intentionally omitted; they are implementation details, not stable API.

    Auth: all `/api/v1/*` endpoints require `Authorization: Bearer <jwt>`.
    The token is obtained from `POST /admin/login` (HS256, `JWT_SECRET` env).
  version: 0.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://127.0.0.1:38090
    description: Local staging (podman, see scripts/deploy/staging-podman.sh)
  - url: https://api.cyberclaw.example.com
    description: Production (placeholder — replace with real DNS)

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Health, readiness, metrics — public
  - name: Auth
    description: Login + identity
  - name: Memory
    description: Long-term semantic memory CRUD
  - name: Agents
    description: Agent listing + invocation
  - name: Executions
    description: Execution log + trace
  - name: Reviews
    description: Human-in-the-loop approval
  - name: Tasks
    description: Task queue
  - name: Chat
    description: Multi-turn chat + clarify + handoff

paths:
  /health:
    get:
      tags: [Meta]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Server is up
          content:
            text/plain:
              schema: { type: string, example: OK }

  /ready:
    get:
      tags: [Meta]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Server is ready to accept traffic
        '503':
          description: Not ready (e.g., DB connection pool empty)

  /metrics:
    get:
      tags: [Meta]
      summary: Prometheus text-format metrics
      security: []
      responses:
        '200':
          description: Prometheus exposition (`text/plain`)
          content:
            text/plain: { schema: { type: string } }

  /admin/login:
    post:
      tags: [Auth]
      summary: Issue a JWT for an existing operator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, password]
              properties:
                user_id: { type: string, example: op_ada }
                password: { type: string }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                    description: "HS256-signed JWT, expires in 1h"
                  user: { $ref: '#/components/schemas/Operator' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/me:
    get:
      tags: [Auth]
      summary: Identity of the JWT holder
      responses:
        '200':
          description: Current operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/memory:
    get:
      tags: [Memory]
      summary: List memory records
      parameters:
        - in: query
          name: agent_id
          schema: { type: string }
        - in: query
          name: level
          schema: { type: string, enum: [L0, L1, L2] }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/MemoryRecord' }
    post:
      tags: [Memory]
      summary: Create memory record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, level, content]
              properties:
                agent_id: { type: string }
                level: { type: string, enum: [L0, L1, L2] }
                content: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryRecord' }

  /api/v1/memory/{id}:
    get:
      tags: [Memory]
      summary: Read memory record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryRecord' }
        '404': { description: Not found }
    delete:
      tags: [Memory]
      summary: Delete memory record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }

  /api/v1/memory/search:
    get:
      tags: [Memory]
      summary: Semantic + lexical hybrid search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: agent_id
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Hits ordered by relevance
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MemoryRecord'
                        - type: object
                          properties:
                            score: { type: number }

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List registered agents
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }

  /api/v1/agents/{name}/invoke:
    post:
      tags: [Agents]
      summary: Trigger an agent execution
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: object, additionalProperties: true }
                execution_mode:
                  type: string
                  enum: [Normal, Autopilot, Persistent]
                  default: Normal
      responses:
        '202':
          description: Execution queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id: { type: string }

  /api/v1/executions:
    get:
      tags: [Executions]
      summary: List executions
      parameters:
        - in: query
          name: agent_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '200':
          description: Executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  executions:
                    type: array
                    items: { $ref: '#/components/schemas/Execution' }

  /api/v1/executions/{id}/trace:
    get:
      tags: [Executions]
      summary: Full trace timeline (events + artifacts + provenance)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trace JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/executions/{id}/cancel:
    post:
      tags: [Executions]
      summary: Cancel a running execution
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cancelled }
        '409': { description: Already terminal }

  /api/v1/reviews:
    get:
      tags: [Reviews]
      summary: List pending reviews
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, expired] }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }

  /api/v1/reviews/{id}/approve:
    post:
      tags: [Reviews]
      summary: Approve a review
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200': { description: Approved }

  /api/v1/reviews/{id}/reject:
    post:
      tags: [Reviews]
      summary: Reject a review
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200': { description: Rejected }

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, payload]
              properties:
                agent_id: { type: string }
                payload: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing / invalid / expired JWT
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: unauthorized }

  schemas:
    Operator:
      type: object
      properties:
        user_id: { type: string, example: op_ada }
        role: { type: string, enum: [admin, viewer, qa] }
        display_name: { type: string }

    MemoryRecord:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        level: { type: string, enum: [L0, L1, L2] }
        content: { type: string }
        created_at: { type: string, format: date-time }
        trust_level: { type: string, enum: [untrusted, low, medium, high] }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        capabilities:
          type: array
          items: { type: string }

    Execution:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        execution_mode:
          type: string
          enum: [Normal, Autopilot, Persistent]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        tokens_used: { type: integer, nullable: true }

    Review:
      type: object
      properties:
        id: { type: string }
        execution_id: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        risk_level: { type: string, enum: [Low, Medium, High, Critical] }
        capability_id: { type: string }
        requested_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
